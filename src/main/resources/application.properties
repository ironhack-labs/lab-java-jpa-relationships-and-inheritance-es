spring.application.name=jpa-relationships

# In-memory H2 database: the schema is generated from the entities on startup
# and dropped on shutdown, so every run starts from the same seed data.
spring.datasource.url=jdbc:h2:mem:jpalab
spring.jpa.hibernate.ddl-auto=create-drop

# Set to true to see the generated DDL and every SQL statement.
spring.jpa.show-sql=false
